name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed 40-character commit SHA (blank checks the selected branch)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.revision || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: xode-linux-x64
    timeout-minutes: 30
    env:
      # Xode workers have no host GPU; Firefox and WebKit use Mesa's software renderer.
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Validate requested revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REVISION" && ! "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Supply a reviewed full commit SHA, or leave revision blank.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: |
          revision=$(git rev-parse HEAD)
          echo "Tested commit: $revision" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the fresh worker
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential python3 xz-utils unzip libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 xvfb xauth mesa-utils
          sudo mkdir -p "$RUNNER_TOOL_CACHE"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TOOL_CACHE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Install browser binaries
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm run verify:browser
      - name: Verify browser compatibility on a virtual display
        run: |
          xvfb-run -a glxinfo -B
          DEBUG=pw:browser xvfb-run -a npm run verify:compatibility
      - name: Keep browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 1
