name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed 40-character commit SHA (blank checks the selected branch)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.revision || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: [self-hosted, linux, x64, containment]
    timeout-minutes: 30
    steps:
      - name: Validate requested revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REVISION" && ! "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Supply a reviewed full commit SHA, or leave revision blank.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: |
          revision=$(git rev-parse HEAD)
          echo "Tested commit: $revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser binaries
        run: npx playwright install chromium firefox webkit
      - run: npm run check
      - run: npm run verify:browser
      - run: npm run verify:compatibility
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
